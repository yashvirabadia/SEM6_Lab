<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script> -->
</head>
<body>

    <div class="container mt-3">
        <div class="nav-bar navbar-expand-lg bg-body-tertiary mb-3">
            <div class="container-fluid">
              <a class="navbar-brand" href="#">Navbar</a>
              
              <div class="nav-bar" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#FormEvent">Form Event</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#MouseEvent">Mouse Event</a>
                  </li>
                </ul>
              </div>
        </div>

        <div class="content mt-3 mb-3">
            <div id="FormEvent" >
                <div>
                <form>
                    <label>Enrollment</label>
                    <input type="text" name="enrollment" id="enrollment">
                    <label>name</label>
                    <input type="text" name="name" id="name">
                    <label>Elective Subject</label>
                    <select name="elective" id="elective">
                        <option >.Net</option>
                        <option >AWT</option>
                        <option >INS</option>
                    </select>
                    <input type="submit" value="Submit" id="submitBtn">

                </form>
                </div>
                <div id="write" class="border"></div>
            </div>

            <div id="MouseEvent " class="mt-5">

                <h2>Mouse Event</h2>

                <div class="border p-5" id="mouseBox">
                    Hover over this box to see mouse events in action.
                    click, double-click, mouse enter, and mouse leave events will be handled here.
                </div>

            </div>

        </div>

    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function(){
            $("#enrollment").focus(function(){
                $(this).css("background-color", "lightyellow");
            });

            $("#enrollment").blur(function(){
                $(this).css("background-color", "white");
            });

            $("#name").select(function(){
                $(this).css("background-color", "lightgreen");
            });

            $("#elective").change(function(){
                var subject = $(this).val();
                $("#write").html("You have selected: " + subject);
            });

            $("#submitBtn").click(function(event){
                event.preventDefault();
                var enrollment = $("#enrollment").val();
                var name = $("#name").val();
                var elective = $("#elective").val();
                $("#write").html("<p>Enrollment: " + enrollment + "</p><p>Name: " + name + "</p><p>Elective Subject: " + elective + "</p>");
            });

            $("#mouseBox").click(function(){
                $(this).on({
                    click: function(){
                        $(this).css("background-color", "lightblue");
                    },
                    dblclick: function(){
                        $(this).css("background-color", "lightcoral");
                    },
                    mouseenter: function(){
                        $(this).css("background-color", "lightgreen");
                    },
                    mouseleave: function(){
                        $(this).css("background-color", "white");
                    },
                    contextmenu: function(){
                        $(this).css("background-color", "lightgray");
                    }
                })
            });

            //use of star and comma selector
            



        })
    </script>
</body>
</html>
